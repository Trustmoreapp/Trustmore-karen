<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Profissionais imigrantes na Europa, com avaliações de quem já contratou. Faxina, obras, beleza, mudanças e muito mais.">
<meta property="og:title" content="Trustmore — contrate com confiança">
<meta property="og:description" content="Profissionais imigrantes na Europa, com avaliações reais de clientes e contato direto pelo WhatsApp.">
<meta property="og:image" content="https://trustmore.app/icons/icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#071633">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trustmore">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Trustmore — profissionais de confiança</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky navy nav (brand left, links + quiet language picker right); home alternates full-width bands; Sobre and Profissionais are their own pages; profile is a two-column sheet */
:root{
  --navy:#071633; --navy-2:#12305c; --navy-3:#0c2050; --gold:#d99a2b; --gold-soft:#fbd97a; --star:#FFC72C;
  --bg:#f6f5f1; --bg-2:#ecebe4; --surface:#ffffff; --fg:#0f1a2e; --muted:#5b6475; --line:#e0ded6; --chip:#efece4;
  --on-navy:#f4f1e8; --on-navy-mut:#c3cad8; --ok:#1f7a4d; --wa:#1f9d55; --link:#12305c;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --bg-2:#0f1829; --surface:#131c2f; --fg:#e9ecf3; --muted:#a3abbb; --line:#25314b; --chip:#1b2640;
  --navy:#050d1f; --navy-2:#173561; --navy-3:#0a1a3a; --ok:#4cc38a; --link:#fbd97a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b1220; --bg-2:#0f1829; --surface:#131c2f; --fg:#e9ecf3; --muted:#a3abbb; --line:#25314b; --chip:#1b2640;
  --navy:#050d1f; --navy-2:#173561; --navy-3:#0a1a3a; --ok:#4cc38a; --link:#fbd97a; color-scheme:dark }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
input[type=file]{max-width:100%;min-width:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.eyebrow{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.lead{font-size:18px;color:var(--muted);max-width:60ch;margin:12px 0 0}
section.band{padding-block:72px}
section.band.alt{background:var(--bg-2)}
section.band.dark{background:var(--navy);color:var(--on-navy)}
section.band.dark .lead{color:var(--on-navy-mut)}
.shead{max-width:720px;margin-bottom:36px}
.shead h2{font-size:clamp(28px,4vw,40px);line-height:1.1;margin-top:8px}
.center{text-align:center;margin-inline:auto}
.center .lead{margin-inline:auto}
@media (max-width:640px){section.band{padding-block:52px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15.5px}
.btn.gold{background:var(--gold);color:#1d1404}
.btn.gold:hover{background:#e6a83a}
.btn.ghost{background:transparent;border:1px solid rgba(244,241,232,.35);color:var(--on-navy)}
.btn.ghost:hover{background:rgba(244,241,232,.08)}
.btn.navy{background:var(--navy-2);color:var(--on-navy)}
.btn.navy:hover{filter:brightness(1.1)}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.btn.line:hover{border-color:var(--gold)}

.demo{background:var(--gold-soft);color:#3a2a05;font-size:13px;text-align:center;padding:6px 12px}

/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:var(--on-navy);border-bottom:1px solid rgba(255,255,255,.07)}
nav.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--on-navy);flex:none}
.brand b{font-family:var(--display);font-size:21px;font-weight:800}
.links{display:flex;gap:4px;margin-left:auto;align-items:center}
.links a{text-decoration:none;padding:8px 12px;border-radius:9px;font-weight:500;font-size:15px;color:var(--on-navy-mut)}
.links a:hover{color:var(--on-navy);background:rgba(255,255,255,.06)}
.links a[aria-current="page"]{color:var(--on-navy)}
.links .btn{padding:9px 16px;font-size:14.5px;margin-left:6px;color:#1d1404}
.links .btn:hover{color:#1d1404;background:#e6a83a}
.lang{display:flex;align-items:center;gap:4px;color:var(--on-navy-mut);opacity:.75;font-size:13px;flex:none}
.lang:hover,.lang:focus-within{opacity:1}
.lang select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;cursor:pointer;padding:4px 2px}
.lang select option{color:#0f1a2e;background:#fff}
@media (max-width:860px){
  nav.top .wrap{flex-wrap:wrap;gap:8px}
  .lang{order:2;margin-left:auto}
  .links{order:3;width:100%;margin-left:0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .links a{flex:none;font-size:14px;padding:6px 10px}
  .links .btn{margin-left:auto;flex:none}
}

/* hero */
.hero{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-180px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(217,154,43,.28),transparent 65%);pointer-events:none}
.hero .wrap{padding-block:64px 72px;position:relative;z-index:1}
.hero h1{font-weight:800;font-size:clamp(34px,6vw,62px);line-height:1.03;max-width:16ch;margin-top:12px}
.hero h1 em,.pagehero h1 em{font-style:normal;color:var(--gold-soft)}
.hero .lead{color:var(--on-navy-mut);font-size:19px}
.search{margin-top:30px;display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:6px;background:var(--surface);border-radius:var(--r);padding:8px;max-width:900px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.search label{display:flex;flex-direction:column;gap:1px;padding:7px 12px;border-radius:10px;min-width:0;color:var(--fg)}
.search label:hover{background:var(--chip)}
.search span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.search select{border:0;background:transparent;padding:2px 0;font-weight:600;color:var(--fg);width:100%;cursor:pointer}
.search select:focus{outline:none}
.search .btn{border-radius:11px}
@media (max-width:720px){.search{grid-template-columns:1fr}}
.assure{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:22px;color:var(--on-navy-mut);font-size:14.5px}
.assure span{display:flex;align-items:center;gap:7px}
.assure svg{color:var(--gold-soft);flex:none}

/* categories */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cattile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.cattile:hover{border-color:var(--gold);transform:translateY(-2px)}
.cattile .ic{width:40px;height:40px;border-radius:11px;background:var(--chip);display:grid;place-items:center;color:var(--gold)}
.cattile b{font-size:15.5px}
.cattile small{color:var(--muted);font-size:13px}

/* results */
.resbar{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.resbar h2{font-size:clamp(24px,3.4vw,32px)}
.resbar small{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:thin}
.chipb{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:500;font-size:14px}
.chipb[aria-pressed="true"]{background:var(--navy-2);border-color:var(--navy-2);color:var(--on-navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 12px 30px rgba(7,22,51,.08)}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.av{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;color:#fff}
.who div{min-width:0}
.who h3{font-family:var(--body);font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.who p{margin:0;color:var(--muted);font-size:14px}
.ver{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;flex:none}
.rate{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:14px;flex-wrap:wrap}
.rate b{font-size:15px}
.stars{color:var(--star);letter-spacing:1px}
.rate small{color:var(--muted)}
.quote{margin:0;font-size:14.5px;border-left:3px solid var(--gold);padding-left:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--muted)}
.cardfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:14px;font-weight:600;color:var(--link)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:14px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.step::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:800;font-size:15px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1d1404;display:grid;place-items:center;margin-bottom:14px}
.step h3{font-size:20px}
.step p{margin:8px 0 0;color:var(--muted)}

/* trust */
.trust{display:grid;grid-template-columns:1fr 1.25fr;gap:48px;align-items:center}
@media (max-width:900px){.trust{grid-template-columns:1fr;gap:32px}}
.trust h2{font-size:clamp(30px,4.4vw,46px);line-height:1.06;margin-top:10px}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.pillars{grid-template-columns:1fr}}
.pillar{background:var(--navy-3);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:20px}
.pillar svg{color:var(--gold-soft)}
.pillar h3{font-family:var(--body);font-size:16.5px;font-weight:700;margin-top:10px}
.pillar p{margin:6px 0 0;color:var(--on-navy-mut);font-size:14.5px}
.tips{margin-top:28px;border-top:1px solid rgba(255,255,255,.12);padding-top:22px}
.tips h3{font-family:var(--body);font-size:15px;font-weight:700;color:var(--gold-soft)}
.tips ul{margin:10px 0 0;padding-left:18px;color:var(--on-navy-mut);font-size:15px;display:grid;gap:6px}

/* pro band */
.proband{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
@media (max-width:900px){.proband{grid-template-columns:1fr}}
.proband h2{font-size:clamp(30px,4.4vw,44px);line-height:1.06;margin-top:10px}
.checks{list-style:none;padding:0;margin:22px 0 26px;display:grid;gap:12px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks li svg{flex:none;margin-top:3px;color:var(--ok)}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 24px 60px rgba(7,22,51,.12);max-width:420px;justify-self:center;width:100%}
.mock .stat{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--chip);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.mock .stat b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;flex:none}
.mock .note{font-size:12px;color:var(--muted);margin:10px 0 0}

/* faq */
.faq{max-width:780px;margin:0 auto;display:grid;gap:10px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 18px}
.faq summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;line-height:1;color:var(--gold)}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 16px;color:var(--muted)}

/* final cta */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.duo > div{border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.duo .a{background:var(--navy);color:var(--on-navy)}
.duo .a p{color:var(--on-navy-mut)}
.duo .b{background:var(--gold-soft);color:#1d1404}
.duo .b .eyebrow{color:#7a4f06}
.duo h3{font-size:clamp(24px,3vw,30px);line-height:1.1}
.duo p{margin:0;max-width:40ch}
.duo .full{grid-column:1/-1;align-items:center;text-align:center}

/* about */
.pagehero{background:var(--navy);color:var(--on-navy)}
.pagehero .wrap{padding-block:64px}
.pagehero h1{font-size:clamp(34px,5.6vw,58px);line-height:1.04;max-width:18ch;margin-top:12px;font-weight:800}
.pagehero .lead{color:var(--on-navy-mut)}
.herobtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.story{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
@media (max-width:860px){.story{grid-template-columns:1fr;gap:24px}}
.story h2{font-size:clamp(28px,3.8vw,38px);line-height:1.1;margin-top:8px}
.story p{margin:0 0 14px;max-width:62ch}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:10px}
.chat .gname{font-size:12.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:10px}
.msg{background:var(--chip);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:14.5px;max-width:88%}
.msg small{display:block;font-weight:700;color:var(--gold);font-size:12px}
.msg.me{justify-self:end;background:var(--navy-2);color:var(--on-navy);border-radius:14px 4px 14px 14px}
.chat .cap{font-size:12px;color:var(--muted);margin:4px 0 0}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.cols3{grid-template-columns:1fr}}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.feat svg{color:var(--gold)}
.feat h3{font-size:20px;margin-top:12px}
.feat p{margin:8px 0 0;color:var(--muted)}
.values{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
@media (max-width:860px){.values{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.values{grid-template-columns:1fr}}
.values div{padding:22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.values b{font-family:var(--display);font-size:19px;display:block}
.values p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.helps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.helps{grid-template-columns:1fr}}
.helps > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.helps h3{font-size:22px}
.helps ul{margin:12px 0 0;padding-left:18px;display:grid;gap:8px;color:var(--muted)}

/* profile */
.phero{background:var(--navy);color:var(--on-navy)}
.phero .wrap{padding-block:22px 34px}
.back{background:none;border:0;color:var(--gold-soft);cursor:pointer;padding:0;font-weight:600}
.phead{display:flex;gap:18px;align-items:center;margin-top:18px;flex-wrap:wrap}
.phead .av{width:84px;height:84px;font-size:30px;border:3px solid var(--gold)}
.phead h1{font-weight:800;font-size:clamp(28px,4vw,40px);line-height:1.08}
.phead p{margin:2px 0 0;color:var(--on-navy-mut)}
.phead .rate{margin-top:6px}
.phead .rate small{color:var(--on-navy-mut)}
.sheet{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start;padding-block:28px 56px}
@media (max-width:860px){.sheet{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.box h2{font-size:19px;margin:0 0 10px}
.box + .box{margin-top:16px}
.bio{margin:0;max-width:62ch}
.orig{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.trbtn{background:none;border:0;padding:0;color:var(--link);font-weight:600;cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:16px 0 0;font-size:14.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0}
.svc{display:flex;flex-wrap:wrap;gap:6px}
.revsum{display:flex;gap:18px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.revsum .big{font-family:var(--display);font-size:44px;font-weight:800;line-height:1}
.bars{flex:1;min-width:180px;display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars div{display:grid;grid-template-columns:14px 1fr 18px;gap:8px;align-items:center}
.bars i{display:block;height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
.bars i span{display:block;height:100%;background:var(--star)}
.rev{border-top:1px solid var(--line);padding-block:14px}
.rev header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rev b{font-weight:600}
.rev time{color:var(--muted);font-size:13px}
.rev p{margin:4px 0 0}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;font-size:15px}
.cta.wa{background:var(--wa);color:#fff}
.cta.wa:hover{background:#178447}
.cta.sec{background:var(--chip);color:var(--fg)}
.cta.sec:hover{filter:brightness(.97)}
.linkbox{display:flex;gap:6px;align-items:center;background:var(--chip);border-radius:10px;padding:8px 10px;font-size:13.5px;min-width:0}
.linkbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}

 tr_eyebrow:'Trust comes first', tr_h2:'Without trust, nobody opens their front door.',
 tr_lead:'Hiring someone abroad is hard: you don’t know anyone, recommendations get lost in group chats, and there’s no way to tell who is really good. Trustmore exists to fix that.',

 faq:[['Do I pay to hire someone through Trustmore?','No. Trustmore is free for customers. You talk directly to the professional and agree on the price with them.'],['Are the reviews real?','Reviewers give their name and WhatsApp number, which aren’t shown on the site but are kept for checking. Professionals can’t delete reviews, and we remove spam, abuse and fake reviews.'],['What does the verified badge mean?','It means Trustmore confirmed the professional’s identity by video call or ID.'],['Is Trustmore responsible for the service?','Trustmore is a showcase: the agreement, payment and job are arranged between you and the professional. That’s why reviews matter so much. If something goes wrong, say so in your review and contact us.'],['There’s no one in my city. What now?','We’re growing across Europe. If you know a good professional, tell them about Trustmore so your city appears in the showcase.']],
 ca_eyebrow:'For customers', ca_h:'Need a service?', ca_p:'Find reviewed professionals in your city and talk to them directly. Free.',
 cb_eyebrow:'For professionals', cb_h:'Want more customers?', cb_p:'Create your profile, collect your reviews and get found by people looking for your service.', cb_btn:'Create my profile',
 ab_eyebrow:'About us', ab_h1:'Made by immigrants, <em>for immigrants.</em>', ab_lead:'Trustmore was born from a problem every immigrant knows: needing someone you can trust in a country where you don’t know anyone yet.',
 st_eyebrow:'Why we started', st_h2:'It all began with a question in a group chat',
 st_p:['“Can anyone recommend a cleaner they trust?” Anyone living abroad has seen that message hundreds of times in WhatsApp and Facebook groups. Replies pour in, names and numbers, and by the next day it’s all buried in the chat.','People who need a service don’t know who to trust. And good professionals, who have done great work for years, depend on luck: someone remembering them at the right moment.','We built Trustmore to bring both sides together in one place, with what matters most when you let someone into your home or look after your child: <b>the opinion of people who already hired them</b>.'],
 chat_g:'Immigrant group chat · example', chat:['Can anyone recommend a cleaner they trust in Amsterdam?','I have one’s number, but I haven’t talked to her in a while','DM me','Carla, look: trustmore.app. You can see everyone’s reviews before you message them'], chat_cap:'Illustrative conversation.',
 fs_eyebrow:'What we do', fs_h2:'A showcase where trust comes before the contract', fs_lead:'We bring immigrant professionals from across Europe together in one place, each with a full profile and reviews from real customers.',
 fs:[['Connects people who need help with people who do the work','Customers find professionals by service and city. Professionals get found without relying only on word of mouth.'],['Turns recommendations into proof','A recommendation that used to vanish in a group chat becomes a public review that stays on the profile and helps the next person decide.'],['Speaks your language','Professionals who speak many languages, working in many countries. Trustmore grows with the community.']],

 faq:[['Betaal ik om iemand via Trustmore in te huren?','Nee. Voor klanten is Trustmore gratis. Je praat direct met de vakman en spreekt de prijs met hem of haar af.'],['Zijn de reviews echt?','Reviewers geven hun naam en WhatsApp-nummer op. Die staan niet op de site, maar wij bewaren ze ter controle. Vakmensen kunnen geen reviews verwijderen, en wij halen spam, beledigingen en nepreviews weg.'],['Wat betekent het verificatiebadge?','Dat Trustmore de identiteit van de vakman heeft gecontroleerd via een videogesprek of ID.'],['Is Trustmore verantwoordelijk voor de dienst?','Trustmore is een etalage: afspraak, betaling en klus regel je samen met de vakman. Daarom zijn reviews zo belangrijk. Ging er iets mis? Vertel het in je review en neem contact met ons op.'],['Er is niemand in mijn stad. Wat nu?','We groeien in heel Europa. Ken je een goede vakman, vertel dan over Trustmore, zodat jouw stad in de etalage verschijnt.']],

 st_eyebrow:'Waarom we begonnen', st_h2:'Het begon met een vraag in een groepschat',
 st_p:['“Kan iemand een betrouwbare schoonmaker aanraden?” Wie in het buitenland woont, heeft dat bericht honderden keren gezien in WhatsApp- en Facebookgroepen. Er komen reacties, namen en nummers, en de volgende dag is alles weer weggezakt in de chat.','Wie een dienst nodig heeft, weet niet wie te vertrouwen. En de goede vakman, die al jaren goed werk levert, is afhankelijk van geluk: dat iemand op het juiste moment aan hem denkt.','We bouwden Trustmore om die twee kanten op één plek samen te brengen, met wat het belangrijkst is als je iemand in huis laat of op je kind laat passen: <b>de mening van wie hen al inhuurde</b>.'],
 chat_g:'Groepschat · voorbeeld', chat:['Kan iemand een betrouwbare schoonmaker in Amsterdam aanraden?','Ik heb het nummer van iemand, maar heb haar al lang niet gesproken','Stuur me een privébericht','Carla, kijk hier: trustmore.app. Je ziet van iedereen de reviews voordat je contact opneemt'], chat_cap:'Fictief gesprek.',

/* Reduz a foto no próprio celular antes de enviar (máx. 600px, JPEG) */
function shrink(file){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 600/Math.max(img.width,img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82)); };
    img.onerror = () => res('');
    img.src = url;
  });
}

function bindPainelFeed(me){

  ov.innerHTML = `<div class="ovbox sheetbox" role="dialog" aria-modal="true" aria-label="${esc(t('inst_h'))}">
    <div class="sheethead">${LOGO(52)}<div><h2 style="font-size:22px">${t('inst_h')}</h2><p class="hint" style="font-size:14px">${t('inst_p')}</p></div></div>
    ${ios ? block(t('inst_ios_h'), t('inst_ios')) + block(t('inst_and_h'), t('inst_and')) : block(t('inst_and_h'), t('inst_and')) + block(t('inst_ios_h'), t('inst_ios'))}
    <button class="btn gold" id="ovx" style="width:100%">${t('inst_ok')}</button></div>`;
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  ov.onclick = e => { if (e.target === ov) closePost(); };
  $('#ovx').onclick = closePost; $('#ovx').focus();
}
function renderTabbar(){
  const h = location.hash.slice(1);
  const active = h === 'trabalhos' ? 1 : h === 'resultados' ? 2 : ['entrar','painel','cadastro'].includes(h) ? 3 : (h === '' ? 0 : -1);
  const items = [['#', P.home], ['#trabalhos', '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'],
    ['#resultados', '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'], ['#entrar', '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.4 4.2-6.5 8-6.5s7 2.1 8 6.5"/>']];
  $('#tabbar').innerHTML = items.map(([href, ic], i) => `<a href="${href}" class="tb" ${i===active?'aria-current="page"':''}>${sv(22, ic)}<span>${t('tb')[i]}</span></a>`).join('');
  const s = $('#tabbar a[href="#resultados"]');
  if (s) s.onclick = e => { if (location.hash === '#resultados') { e.preventDefault(); document.getElementById('resultados')?.scrollIntoView({behavior:'smooth'}); } };
}

/* ---------- ROTAS ---------- */
let shownSlug = null;
async function route(keep){
  const h = location.hash.slice(1);
  renderTabbar();
  if (!keep) { const a = $('#app'); a.classList.remove('enter'); void a.offsetWidth; a.classList.add('enter'); }
  $$('.links a[data-r]').forEach(a => { if (a.dataset.r === h) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (h.startsWith('p-')) {
    const slug = h.slice(2);
    if (!keep) { $('#app').innerHTML = `<div class="wrap" style="padding-block:80px"><div class="empty">${t('loading')}</div></div>`; window.scrollTo(0,0); }
    const p = await loadPro(slug);
    if (location.hash.slice(1) !== h) return;
    if (p) { renderProfile(p); if (shownSlug !== slug) { track(slug, 'visita'); shownSlug = slug; } if (!keep) window.scrollTo(0,0); return; }
    $('#app').innerHTML = `<div class="wrap" style="padding-block:80px"><div class="empty">${t('not_found')}<br><a class="btn line" href="#">${t('empty_btn')}</a></div></div>`;
    return;
  }
  shownSlug = null;
  if (h.startsWith('acesso-')) {
    $('#app').innerHTML = `<div class="wrap" style="padding-block:80px"><div class="empty">${t('loading')}</div></div>`;
    try { const r = await apiPost({a:'auth', code:h.slice(7)}); if (r.s) { store.set('tm-s', r.s); ME = null; dTab = 0; location.replace('#painel'); return; } } catch(e) {}
    location.replace('#entrar'); return;
  }
  if (h === 'cadastro') { renderCadastro(); if (!keep) window.scrollTo(0,0); return; }
  if (h === 'trabalhos') { renderFeed(); if (!keep) window.scrollTo(0,0); return; }
  if (h === 'entrar') { renderEntrar(); if (!keep) window.scrollTo(0,0); return; }
  if (h === 'painel') { renderPainel(); if (!keep) window.scrollTo(0,0); return; }
  if (h === 'sobre') { renderSobre(); if (!keep) window.scrollTo(0,0); return; }
  if (h === 'profissionais') { renderPros(); if (!keep) window.scrollTo(0,0); return; }
  if (h === 'confianca' || h === 'perguntas' || h === 'resultados') return renderHome(keep ? null : h, keep);
  renderHome(null, keep);
}
window.addEventListener('hashchange', () => route(false));
/* No site real (trustmore.app) liga o modo app: abre rápido e funciona com internet fraca */
if ('serviceWorker' in navigator && /(^|\.)trustmore\.app$/.test(location.hostname)) navigator.serviceWorker.register('/sw.js').catch(()=>{});
renderChrome();
if (LIVE) { route(false); Promise.all([loadList(), loadFeed()]).then(() => { const h = location.hash.slice(1); if (!h || ['confianca','perguntas','resultados'].includes(h)) renderHome(null, true); else if (h === 'trabalhos') renderFeed(); }); }
else loadList().then(() => route(false));
</script>
